name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        run: pip install -e ".[dev]" pyinstaller

      - name: Install frontend deps + build
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: PyInstaller build
        run: pyinstaller AgentSuiteLocal.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc installer/AgentSuiteLocal.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AgentSuiteLocal-Windows-Setup
          path: dist/AgentSuiteLocal-*-setup.exe
          if-no-files-found: error

  build-macos:
    name: macOS build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        run: pip install -e ".[dev]" pyinstaller

      - name: Install frontend deps + build
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: PyInstaller build
        run: pyinstaller AgentSuiteLocal.spec --noconfirm

      - name: Create DMG
        run: |
          hdiutil create -volname AgentSuiteLocal \
            -srcfolder dist/AgentSuiteLocal.app \
            -ov -format UDZO \
            dist/AgentSuiteLocal-${{ github.ref_name }}.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: AgentSuiteLocal-macOS
          path: dist/AgentSuiteLocal-*.dmg
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AgentSuiteLocal-Windows-Setup
          path: release-artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: AgentSuiteLocal-macOS
          path: release-artifacts

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          # Extract just the section for this version from CHANGELOG.md
          awk "/^## \[${VERSION#v}\]/{flag=1; next} flag && /^## \[/{flag=0} flag{print}" CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: AgentSuiteLocal ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-artifacts/*
          draft: false
          prerelease: false
