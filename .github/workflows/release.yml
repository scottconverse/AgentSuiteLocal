name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# SHA pins — update via: gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'
# actions/checkout@v6               → de0fac2e4500dabe0009e67214ff5f5447ce83dd
# actions/setup-python@v6           → a309ff8b426b58ec0e2a45f0f869d46889d02405
# actions/setup-node@v6             → 48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
# actions/upload-artifact@v7        → 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
# actions/download-artifact@v8      → 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
# softprops/action-gh-release@v2    → 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65

jobs:
  # P0: Verify that CI tests passed on this commit before building a release binary.
  # Tags can be pushed against any commit; this gate ensures only green commits ship.
  verify-ci:
    name: Verify CI passed on tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          echo "Checking CI status for commit $SHA..."
          # Allow up to 2 minutes for check runs to appear if CI is still in progress
          for attempt in $(seq 1 12); do
            CONCLUSIONS=$(gh api \
              "/repos/${{ github.repository }}/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name | test("Test \\(Python")) | .conclusion] | .[]' \
              2>/dev/null || echo "")
            echo "Attempt $attempt — CI conclusions: $(echo "$CONCLUSIONS" | tr '\n' ' ')"
            if echo "$CONCLUSIONS" | grep -q "failure\|cancelled\|timed_out"; then
              echo "CI tests failed for commit $SHA. Blocking release."
              exit 1
            fi
            if echo "$CONCLUSIONS" | grep -q "success"; then
              echo "CI tests passed. Proceeding with release build."
              exit 0
            fi
            sleep 10
          done
          echo "Could not confirm CI passed for commit $SHA after 2 minutes. Blocking release for safety."
          echo "Ensure the 'CI' workflow has completed successfully before tagging a release."
          exit 1

  build-windows:
    name: Windows build
    runs-on: windows-latest
    needs: verify-ci

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        # P0: pyinstaller pinned to tested version — prevents silent regressions from upstream changes
        run: pip install -e ".[dev]" pyinstaller==6.20.0

      - name: Install frontend deps + build
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: PyInstaller build
        run: pyinstaller AgentSuiteLocal.spec --noconfirm

      - name: Install Inno Setup
        # Uses pre-installed Inno Setup if iscc is on PATH (GitHub windows-latest runner
        # ships 6.4.3 as of 2026-05 — verify at https://github.com/actions/runner-images).
        # If the runner image upgrades Inno Setup and breaks the build, pin explicitly:
        #   choco install innosetup --version=6.4.3 --force --no-progress -y
        # Note: do NOT invoke iscc here — iscc /? exits 1, which fails the step.
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            $isccPath = (Get-Command iscc).Source
            $isccVer = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1' -ErrorAction SilentlyContinue).DisplayVersion
            Write-Host "Inno Setup on PATH: $isccPath (version: $isccVer)"
          } else {
            choco install innosetup --version=6.4.3 --no-progress -y
          }
          exit 0

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "Building installer for version $ver"
          iscc /DMYAPPVERSION=$ver installer/AgentSuiteLocal.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: AgentSuiteLocal-Windows-Setup
          path: dist/AgentSuiteLocal-*-setup.exe
          if-no-files-found: error

  build-macos:
    name: macOS build
    runs-on: macos-latest
    needs: verify-ci

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        # P0: pyinstaller pinned to tested version
        run: pip install -e ".[dev]" pyinstaller==6.20.0

      - name: Install frontend deps + build
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: PyInstaller build
        run: pyinstaller AgentSuiteLocal.spec --noconfirm

      - name: Verify .app bundle structure
        # P3: verify binary is present and correct arch before creating DMG
        run: |
          test -f dist/AgentSuiteLocal.app/Contents/MacOS/AgentSuiteLocal
          test -f dist/AgentSuiteLocal.app/Contents/Info.plist
          echo "Bundle structure verified."
          file dist/AgentSuiteLocal.app/Contents/MacOS/AgentSuiteLocal

      - name: Create DMG
        run: |
          hdiutil create -volname AgentSuiteLocal \
            -srcfolder dist/AgentSuiteLocal.app \
            -ov -format UDZO \
            dist/AgentSuiteLocal-${{ github.ref_name }}.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: AgentSuiteLocal-macOS
          path: dist/AgentSuiteLocal-*.dmg
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: AgentSuiteLocal-Windows-Setup
          path: release-artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: AgentSuiteLocal-macOS
          path: release-artifacts

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          # Extract just the section for this version from CHANGELOG.md
          awk "/^## \[${VERSION#v}\]/{flag=1; next} flag && /^## \[/{flag=0} flag{print}" CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: AgentSuiteLocal ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-artifacts/*
          draft: false
          prerelease: false
