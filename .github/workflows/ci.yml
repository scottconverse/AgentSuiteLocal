name: CI

# Trigger profile: PR validation only on main. Direct pushes to main go
# through PRs; release/** branches use the release.yml workflow. Dropping
# the duplicate `push: branches: [main]` saves a full CI run per merge
# (was running once on PR + once on post-merge push).
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SHA pins — update via: gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'
# actions/checkout@v6       → de0fac2e4500dabe0009e67214ff5f5447ce83dd
# actions/setup-python@v6   → a309ff8b426b58ec0e2a45f0f869d46889d02405
# actions/setup-node@v6     → 48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff==0.4.10"

      - name: ruff check
        run: ruff check .

      - name: Check action pins are node24+ (Issue #16)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_action_node_versions.py

      - name: Check installer step count drift (DOC-NEW)
        run: python scripts/check_installer_step_count.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, linux, x64]
    needs: lint
    strategy:
      matrix:
        # PRs: 3.12 only (production target). Cross-version regression coverage
        # against 3.11 still gates on release/** push (see release.yml + the
        # `if:` below). Was matrix: ["3.11", "3.12"] — doubled CI minutes on
        # every PR without catching anything PRs were actually breaking.
        python-version: ${{ github.event_name == 'pull_request' && fromJson('["3.12"]') || fromJson('["3.11", "3.12"]') }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps (cleanroom)
        run: pip install -e ".[dev]"

      - name: Unit + integration tests
        # D-4: --cov-fail-under enforces coverage floor.
        # Floor is 58% — Linux CI measures ~58% due to OS-specific branches in main.py
        # that execute on Windows but not on ubuntu-latest. The gap is entirely in
        # main.py (1343 stmts). Floor will rise during the main.py god-file split sprint
        # when each new module gets its own test file.
        # RATCHET RULE: this number may only increase, never decrease.
        # Lowering it requires a commit explaining why, reviewed in PR.
        run: pytest tests/ -v --ignore=tests/e2e -m "not ollama and not real_ollama" --cov=agentsuitelocal --cov-report=term-missing --cov-fail-under=58

  frontend:
    name: Frontend (build + test)
    runs-on: [self-hosted, linux, x64]
    needs: lint

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: web

      - name: Frontend tests (Vitest)
        run: npm run test
        working-directory: web

      - name: Vite build (smoke)
        run: npm run build
        working-directory: web

  build-macos:
    # D-1: macOS build verification — runs on main + version tags
    # A7: also runs on release/* branches so the v1.0 milestone gets the
    # bundle smoke before merging to main.
    # Sprint-A loose-end #4: also runs on PRs targeting main, so bundle
    # regressions are caught at PR time instead of post-merge. The cost
    # is ~5-10 extra min per PR; the v0.8.7-class regression that
    # motivates this job shipped because no PR-time gate caught it.
    name: macOS build (PyInstaller)
    runs-on: macos-latest
    needs: [test, frontend]
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/heads/release/') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps + PyInstaller
        run: pip install -e ".[dev]" pyinstaller==6.20.0

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: web

      - name: PyInstaller build
        run: pyinstaller AgentSuiteLocal.spec

      - name: Verify .app bundle exists
        run: |
          test -f dist/AgentSuiteLocal.app/Contents/MacOS/AgentSuiteLocal
          test -f dist/AgentSuiteLocal.app/Contents/Info.plist
          echo "Bundle structure verified."
          file dist/AgentSuiteLocal.app/Contents/MacOS/AgentSuiteLocal

      # A7: post-PyInstaller bundle smoke — catches v0.8.7-class regressions
      # where the .app ships missing a hidden import. Launches the bundled
      # binary, waits for launcher.port.json, hits /api/health, then kills.
      - name: Bundle smoke (launch + /api/health)
        run: |
          set -e
          rm -f ~/.agentsuitelocal/launcher.port.json
          # BROWSER=echo prevents webbrowser.open from blocking on headless macOS
          BROWSER=echo dist/AgentSuiteLocal.app/Contents/MacOS/AgentSuiteLocal &
          BUNDLE_PID=$!
          echo "Bundle PID: $BUNDLE_PID"
          # Wait up to 30s for launcher.port.json
          for i in $(seq 1 60); do
            if [ -f ~/.agentsuitelocal/launcher.port.json ]; then
              echo "launcher.port.json found after ${i} polls (~$((i*500))ms)"
              break
            fi
            sleep 0.5
          done
          if [ ! -f ~/.agentsuitelocal/launcher.port.json ]; then
            echo "FAIL: launcher.port.json not written within 30s"
            kill $BUNDLE_PID 2>/dev/null || true
            exit 1
          fi
          PORT=$(python3 -c "import json; print(json.load(open('$HOME/.agentsuitelocal/launcher.port.json'))['port'])")
          echo "Bundle bound to port: $PORT"
          # Hit /api/health
          curl -fsS "http://127.0.0.1:${PORT}/api/health"
          echo ""
          echo "OK: /api/health returned 200"
          # Clean shutdown
          kill $BUNDLE_PID
          wait $BUNDLE_PID 2>/dev/null || true
          echo "Bundle exited cleanly."

  build-windows:
    # A7: Windows bundle smoke — catches v0.8.7-class regressions on the
    # Windows distributable (the platform that originally shipped the broken
    # bundle missing the `ollama` SDK hidden import).
    # Sprint-A loose-end #4: also runs on PRs targeting main — same reason
    # as build-macos. Bundle smoke at PR time is cheap insurance against
    # the class of bug this job exists to catch.
    name: Windows build (PyInstaller)
    runs-on: windows-latest
    needs: [test, frontend]
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/heads/release/') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps + PyInstaller
        run: pip install -e ".[dev]" pyinstaller==6.20.0

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: web

      - name: PyInstaller build
        run: pyinstaller AgentSuiteLocal.spec

      - name: Verify .exe bundle exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AgentSuiteLocal/AgentSuiteLocal.exe")) {
            throw "AgentSuiteLocal.exe not found in dist/"
          }
          Write-Host "Bundle structure verified."

      - name: Bundle smoke (launch + /api/health)
        shell: pwsh
        run: |
          $portFile = "$env:USERPROFILE\.agentsuitelocal\launcher.port.json"
          if (Test-Path $portFile) { Remove-Item $portFile -Force }
          # BROWSER=echo prevents webbrowser.open from blocking
          $env:BROWSER = "echo"
          $proc = Start-Process -FilePath "dist/AgentSuiteLocal/AgentSuiteLocal.exe" -PassThru
          Write-Host "Bundle PID: $($proc.Id)"
          # Wait up to 30s for launcher.port.json
          $found = $false
          for ($i = 1; $i -le 60; $i++) {
            if (Test-Path $portFile) {
              Write-Host "launcher.port.json found after $i polls (~$($i*500)ms)"
              $found = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $found) {
            Write-Host "FAIL: launcher.port.json not written within 30s"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          $port = (Get-Content $portFile | ConvertFrom-Json).port
          Write-Host "Bundle bound to port: $port"
          $resp = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -UseBasicParsing
          if ($resp.StatusCode -ne 200) {
            Write-Host "FAIL: /api/health returned $($resp.StatusCode)"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "OK: /api/health returned 200"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Bundle exited cleanly."

  e2e:
    # J3: E2E job — PRs to main + release/v0.9.0 push (TEST-004)
    # Extended from "PRs to main only" so the milestone branch gets
    # Playwright E2E coverage before it merges. Remove the push branch
    # filter after release/v0.9.0 merges to main.
    name: Playwright E2E
    runs-on: [self-hosted, linux, x64]
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/release/v0.9.0')
    needs: [test, frontend]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # D-3: replace sleep 3 with health-check poll (up to 15 seconds)
          for i in $(seq 1 30); do
            curl -s http://localhost:11434/api/tags >/dev/null 2>&1 && break
            sleep 0.5
          done

      - name: Pull gemma4:e4b (default model — matches _SETTINGS_DEFAULTS)
        # The smoke endpoint verifies the configured model is actually
        # installed locally before running the kernel-inference probe.
        # _SETTINGS_DEFAULTS["model_name"] is "gemma4:e4b", so CI must
        # have that model present or the smoke step rejects with
        # "Model 'gemma4:e4b' is not installed" and the installer
        # walk fails on Step 5 (Continue stays disabled).
        run: ollama pull gemma4:e4b
        timeout-minutes: 10

      - name: Start backend + write launcher.port.json
        run: |
          mkdir -p ~/.agentsuitelocal
          # ENG-R2-002 / QA-001: write the structured port file (not the legacy
          # plaintext launcher.log) so consumers find the port reliably.
          echo '{"port": 8765, "ts": 0}' > ~/.agentsuitelocal/launcher.port.json
          uvicorn agentsuitelocal.api.main:app --port 8765 &
        env:
          AGENTSUITE_WORKSPACE: /tmp/agentsuite-test
          # TEST2-001: env vars must reach the backend subprocess, not just the
          # test-runner process. Set here so _resolve_llm honors them at the
          # first run dispatch in tests/e2e/test_new_run.py.
          AGENTSUITE_LLM_PROVIDER_FACTORY: tests.e2e.test_new_run:_mock_provider_factory
          AGENTSUITE_ALLOW_MOCK_FACTORY: "1"

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8765/api/health && break || sleep 0.5
          done

      - name: Run E2E tests
        run: pytest tests/e2e/ -v -m e2e
        env:
          BASE_URL: http://localhost:8765
          AGENTSUITE_WORKSPACE: /tmp/agentsuite-test
