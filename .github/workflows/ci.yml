name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps (cleanroom)
        run: pip install -e ".[dev]"

      - name: Unit + integration tests
        run: pytest tests/ -v --ignore=tests/e2e -m "not ollama"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Start backend
        run: uvicorn agentsuitelocal.api.main:app --port 8765 &
        env:
          AGENTSUITE_WORKSPACE: /tmp/agentsuite-test

      - name: Wait for backend
        run: |
          for i in $(seq 1 20); do
            curl -s http://localhost:8765/api/health && break || sleep 0.5
          done

      - name: Run E2E tests
        run: pytest tests/e2e/ -v
        env:
          BASE_URL: http://localhost:8765
