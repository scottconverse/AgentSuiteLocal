name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]

# SHA pins — update via: gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'
# actions/checkout@v4       → 34e114876b0b11c390a56381ad16ebd13914f8d5
# actions/setup-python@v5   → a26af69be951a213d495a4c3e4e4022e16d87065
# actions/setup-node@v4     → 49933ea5288caeca8642d1e84afbd3f7d6820020

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff==0.4.10"

      - name: ruff check
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps (cleanroom)
        run: pip install -e ".[dev]"

      - name: Unit + integration tests
        # D-4: --cov-fail-under enforces coverage floor.
        # Floor is 55% — Linux CI baseline after excluding Windows-specific code paths
        # (keyring D-Bus, Windows path guards). Windows local measures ~58%.
        # Raise by 5% each sprint as cross-platform coverage improves.
        run: pytest tests/ -v --ignore=tests/e2e -m "not ollama" --cov=agentsuitelocal --cov-report=term-missing --cov-fail-under=55

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: web

      - name: Frontend tests (Vitest)
        run: npm run test
        working-directory: web

      - name: Vite build (smoke)
        run: npm run build
        working-directory: web

  build-macos:
    # D-1: macOS build verification — runs on main + version tags
    name: macOS build (PyInstaller)
    runs-on: macos-latest
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps + PyInstaller
        run: pip install -e ".[dev]" pyinstaller==6.20.0

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: web

      - name: PyInstaller build
        run: pyinstaller AgentSuiteLocal.spec

      - name: Verify .app bundle exists
        run: |
          test -f dist/AgentSuiteLocal.app/Contents/MacOS/AgentSuiteLocal
          test -f dist/AgentSuiteLocal.app/Contents/Info.plist
          echo "Bundle structure verified."
          file dist/AgentSuiteLocal.app/Contents/MacOS/AgentSuiteLocal

  e2e:
    # J3: E2E job — runs on PRs to main only (too slow for every push)
    name: Playwright E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [test, frontend]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # D-3: replace sleep 3 with health-check poll (up to 15 seconds)
          for i in $(seq 1 30); do
            curl -s http://localhost:11434/api/tags >/dev/null 2>&1 && break
            sleep 0.5
          done

      - name: Pull gemma2:2b (smallest model)
        run: ollama pull gemma2:2b
        timeout-minutes: 10

      - name: Start backend + write launcher.log
        run: |
          mkdir -p ~/.agentsuitelocal
          echo "8765" > ~/.agentsuitelocal/launcher.log
          uvicorn agentsuitelocal.api.main:app --port 8765 &
        env:
          AGENTSUITE_WORKSPACE: /tmp/agentsuite-test

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8765/api/health && break || sleep 0.5
          done

      - name: Run E2E tests
        run: pytest tests/e2e/ -v -m e2e
        env:
          BASE_URL: http://localhost:8765
          AGENTSUITE_WORKSPACE: /tmp/agentsuite-test
