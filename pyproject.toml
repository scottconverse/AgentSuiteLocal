[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsuitelocal"
dynamic = ["version"]
description = "AgentSuiteLocal — desktop UI for AgentSuite, runs 100% local via Ollama"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.1",
    "aiofiles>=23.2",
    "psutil>=5.9",
    "httpx>=0.27",
    "weasyprint>=62.0",
    "winotify>=1.1.0; sys_platform == 'win32'",
    "pync>=2.0.3; sys_platform == 'darwin'",
    # Pinned to a tagged release — update intentionally before each dist build
    "agentsuite @ git+https://github.com/scottconverse/AgentSuite.git@v1.1.0",
    # N-1: Pin transitive LLM client deps to prevent silent breaking upgrades.
    # These are pulled in by agentsuite but pinned here so the distributable
    # build is reproducible and security patches are explicit.
    "anthropic>=0.28",
    "openai>=1.30",
    "mcp>=1.0",
    # S-2: OS keychain for API key storage (Windows Credential Manager / macOS Keychain / Secret Service)
    "keyring>=25.0",
]

[project.scripts]
agentsuitelocal = "agentsuitelocal.cli:main"

[tool.setuptools.dynamic]
version = {attr = "agentsuitelocal.__version__.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["agentsuitelocal*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.26",
    "pytest-playwright>=0.5",
    "pytest-cov>=5",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ollama: requires a running Ollama daemon with a loaded model",
    "e2e: end-to-end browser tests (require built frontend + running backend)",
]
